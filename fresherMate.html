{id:'c2',cat:'comm',t:'Speaking clearly',learn:'Short sentences, one idea each, no fillers. Pause instead of saying "umm".',q:[{p:'Explain your favourite subject and why, in 4–5 clear sentences.',kw:['because', 'subject', 'example', 'interesting', 'learn']},{p:'Explain how to do something you know well, step by step.',kw:['first', 'then', 'next', 'finally', 'step']},{p:'Describe your college campus to someone who has never visited.',kw:['campus', 'because', 'example', 'library', 'students']},{p:'Explain a recent technology topic to a friend in simple words.',kw:['because', 'example', 'simple', 'means']}]},
{id:'c3',cat:'comm',t:'Professional vocabulary',learn:'Choose precise, polite, neutral wording. State the issue and the ask; avoid blame, slang and vague words.',q:[{p:'A client emailed the wrong file. Which reply is best?',o:[['Thank you for sending this. It appears to be a different file from the one we discussed — could you please share the latest version?',100,'Neutral, specific and polite; it names the issue and makes a clear request without blaming.'],['Thanks! I think there might be a problem with the file, can you check?',60,'Polite, but "a problem" is vague — the client does not know what to fix.'],['Please resend the correct file, as I requested earlier.',30,'The words are polite, but "as I requested earlier" sounds accusatory.'],['The file is incorrect. Send the right one ASAP.',10,'Blunt, an order rather than a request, and "ASAP" adds pressure without reason.']]},{p:'You need more time on a task. Which message is best?',o:[['Could I request an extension until Friday? I want to complete the testing properly.',100,'Specific date, reason, and framed around quality.'],['Would it be possible to get some extra time? The task is bigger than expected.',60,'Polite, but without a date your manager cannot decide.'],['I may need more time; the deadline was unrealistic.',30,'Criticises the deadline instead of proposing a solution.'],["I won't be able to finish. Sorry.",10,'No reason, no new date, no ownership.']]},{p:'You cannot take an extra task today. Which reply is best?',o:[["I'd like to help, but I'm committed to the report due Thursday. Could this wait until Friday, or should we check priorities with you?",100,"Explains the constraint, offers an alternative and respects the manager's priorities."],["I'm quite busy right now, maybe later.",60,'Polite, but "maybe later" is neither a yes nor a date.'],["Sure, I'll fit it in somehow.",30,'Over-committing now creates a bigger problem later.'],["That's not my job.",10,'Dismissive and damages working relationships.']]},{p:'Best email subject to request two days of leave?',o:[['Leave request: 14–15 Oct (handover planned)',100,'Says what and when at a glance.'],['Request for leave',60,'Clear topic but no dates, so the reader must open it to learn more.'],['Urgent!!! Need leave',30,'Urgency and exclamation marks without details look unprofessional.'],['Hi',10,'Gives no information at all.']]}]},
{id:'i1',cat:'int',t:'Tell me about yourself',learn:'Structure: education → skills → project → goal. Do not read your resume aloud.',q:[{p:'HR: "Tell me about yourself."',kw:['education', 'degree', 'skills', 'project', 'experience', 'role', 'goal', 'looking']},{p:'HR: "Introduce yourself and tell me why you chose your degree."',kw:['degree', 'because', 'skills', 'interested', 'goal', 'project']},{p:'HR: "Walk me through your background in one minute."',kw:['studied', 'skills', 'project', 'interned', 'role', 'career']},{p:'HR: "Tell me about yourself without repeating your resume."',kw:['learned', 'project', 'interested', 'skills', 'goal']}]},
{id:'i2',cat:'int',t:'Why should we hire you?',learn:'Match your skills to the role, give proof (a project or result) and show willingness to learn.',q:[{p:'HR: "Why should we hire you?"',kw:['skills', 'project', 'learn', 'team', 'contribute', 'role', 'company']},{p:'HR: "Why do you want to join our company?"',kw:['company', 'learn', 'skills', 'contribute', 'team', 'role']},{p:'HR: "We have many candidates. What makes you different?"',kw:['project', 'learn', 'responsib', 'example', 'team', 'skills']},{p:'HR: "What will you contribute in your first six months?"',kw:['learn', 'contribute', 'team', 'project', 'skills']}]},
{id:'i3',cat:'int',t:'Strengths & weakness',learn:'Pick a real weakness and show what you are doing about it. Back strengths with an example.',q:[{p:'HR: "What is your biggest weakness?"',kw:['weakness', 'working', 'improve', 'practice', 'learned', 'started', 'trying']},{p:'HR: "Tell me a strength and prove it."',kw:['strength', 'example', 'project', 'team', 'result', 'because']},{p:'HR: "How do you handle pressure?"',kw:['pressure', 'plan', 'example', 'deadline', 'calm', 'prioriti']},{p:'HR: "Tell me about a time you made a mistake."',kw:['mistake', 'learned', 'fixed', 'example', 'because', 'responsib']}]},
{id:'i4',cat:'int',t:'Explain your project',learn:'Problem → your role → tools → result → what you learned.',q:[{p:'Interviewer: "Explain your best project."',kw:['problem', 'built', 'developed', 'using', 'role', 'result', 'learned', 'tools']},{p:'Interviewer: "What challenge did you face in a project and how did you solve it?"',kw:['challenge', 'solved', 'tried', 'team', 'result', 'learned']},{p:'Interviewer: "What was your role in your team project?"',kw:['role', 'team', 'responsib', 'built', 'tools', 'result']},{p:'Interviewer: "What would you improve in your project?"',kw:['improve', 'because', 'project', 'time', 'tools', 'learned']}]},
{id:'w1',cat:'work',t:'Teammate disagreement',learn:'Listen, acknowledge, focus on the shared goal, and propose a way to test or compare options.',q:[{p:'Two teammates argue about the approach and ask your view. What do you say?',o:[['Both approaches have merit. Can we compare them against our deadline and test the riskiest part first?',100,'Stays neutral, ties the decision to the goal and proposes a concrete test.'],["I think Ravi's approach is faster, but we could look at Priya's idea if time allows.",60,'Gives a view, but picking a side before comparing makes the other teammate feel dismissed.'],["Let's ask the manager to decide.",30,'Escalating immediately skips the chance for the team to solve it.'],['Whatever the team decides is fine with me.',10,'Staying out of it adds nothing; you were asked for input.']]},{p:'A teammate dismisses your idea in a meeting. You say:',o:[['Understood. Could we try both on a small sample and compare results?',100,'Keeps calm and turns opinion into evidence.'],["Could you explain your concerns? I'd like to understand before we decide.",60,'Good listening, but ending without a proposal leaves the discussion stuck.'],["Fine, we'll do it your way.",30,'Silently giving up hides a possibly valid idea.'],["That's not fair, you never listen.",10,'Personal attack that escalates conflict.']]},{p:'A teammate has not completed their share of the work. You:',o:[["Message: 'I noticed the testing tasks are still open. Is something blocking you? I can help for an hour.'",100,'States facts, asks about blockers and offers support.'],["Ask: 'Are you planning to finish soon? We have a deadline.'",60,'Raises the issue, but sounds like pressure without asking why.'],['Quietly do their part so you do not fall behind.',30,'Solves today but hides the problem and burns you out.'],['Tell the manager that they are not working.',10,'Skips direct conversation and assumes bad intent.']]},{p:'You have concerns about a tool your seniors chose. You say:',o:[['Could I share one concern? In our last test it failed on large files. Would a quick trial help?',100,'Evidence-based, respectful and offers a low-cost check.'],['I have a concern about it. I think we should use another tool.',60,'States a concern but without evidence; seniors may dismiss it.'],["I'm not sure about this tool, but you're more experienced.",30,'Undermines your own valid point.'],["We shouldn't use it.",10,'Flat objection with no reason or alternative.']]}]},
{id:'w2',cat:'work',t:'Delayed task',learn:'Own it early: reason, new timeline, what you need. No excuses.',q:[{p:'Manager: "Why is your task delayed?"',o:[["I underestimated the testing time. I'll finish by Thursday and update you tomorrow with progress.",100,'Owns the cause and gives a firm date and a check-in.'],["Testing took longer than planned. I'll try to finish this week.",60,'Gives a reason, but "try" and "this week" are not a commitment.'],['The requirements changed twice, so it took more time.',30,'May be true, but leads with external causes and gives no new plan.'],["I'm working on it; it will be done soon.",10,'No reason and no date.']]},{p:"You will miss tomorrow's deadline. What do you do?",o:[['Tell your manager today: what is done, what remains and a new date.',100,'Early and transparent, so they can adjust.'],['Message the manager tomorrow morning once you know how much is left.',60,'Waiting removes the time they have to react.'],['Work all night and submit whatever is ready without telling anyone.',30,'Risks poor quality and surprises the manager.'],['Wait until someone asks.',10,'Hiding a known problem damages trust.']]},{p:'You find a mistake in work you already submitted. You:',o:[['Inform the manager immediately, explain the error and share a corrected version with a time.',100,'Owns the mistake and limits the damage.'],['Fix it first, then tell the manager once it is done.',60,'Better than hiding it, but if others used the wrong version, the delay hurts.'],['Quietly fix it in the next version.',30,'Others may keep using the wrong version.'],['Say the requirement was unclear.',10,'Shifts blame instead of fixing the issue.']]},{p:'Two seniors give you urgent tasks that clash. You:',o:[['Tell both about the clash, share timelines and ask which has priority.',100,'Makes the conflict visible and lets the owners decide.'],["Do your reporting manager's task first and inform the other later.",60,'Reasonable instinct, but the other senior is left waiting uninformed.'],['Do the easier one first to show progress.',30,'Easy is not the same as important.'],['Start both and submit whatever is ready by evening.',10,'Risks two unfinished tasks.']]}]},
{id:'w3',cat:'work',t:'Manager criticism',learn:'Stay calm, thank them, clarify exactly what to change, act, then follow up.',q:[{p:'Manager: "Your report was careless." You say:',o:[["Thanks for the feedback. Could you point to the sections to fix? I'll revise today.",100,'Receptive and action-oriented.'],["Sorry about that, I'll be more careful next time.",60,'Apology is fine, but without asking what was wrong you cannot fix it.'],['I had very little time, that is why.',30,'Sounds like an excuse before accepting the feedback.'],["That's unfair, I worked hard.",10,'Defensive; effort is not the issue being discussed.']]},{p:'A senior corrects you in front of the team. You:',o:[["Understood, thank you. I'll correct it now — and could we talk later so I can avoid it next time?",100,'Composed, takes ownership and asks to learn.'],['Okay, noted.',60,'Accepts it but shows no ownership or learning.'],['I was following the earlier instructions.',30,'Defensive in front of the team.'],['Why are you embarrassing me?',10,'Confrontational.']]},{p:'Your manager says only "Make it better." You:',o:[["Could you tell me which parts to improve — content, format or clarity? I'll prioritise those.",100,'Turns a vague comment into specific actions.'],["I'll review it again and send a revised version tomorrow.",60,'Takes action but may guess wrong without clarifying.'],["I think it's already good.",30,'Dismisses the feedback.'],['Tell me exactly what is wrong, otherwise I cannot do it.',10,'Demanding tone puts the burden on the manager.']]},{p:"You disagree with your manager's feedback. You say:",o:[["Thanks, I'll apply it. May I share my reasoning on one point so we are aligned?",100,'Accepts the feedback and opens a respectful discussion.'],["I'll follow it, though I don't agree.",60,'Complies but signals resentment without explaining.'],["Okay, I'll change everything.",30,'Accepting without understanding repeats the issue.'],['I disagree; my version was right.',10,'Closes the conversation.']]}]},
{id:'w4',cat:'work',t:'Explain to a non-technical manager',learn:'Use analogies, state impact and next step. Skip jargon.',q:[{p:'Explain why the website is slow to a non-technical manager.',kw:['because', 'impact', 'users', 'fix', 'simple', 'example', 'time', 'like']},{p:'Explain a bug you found and what it means for the customer.',kw:['customer', 'impact', 'fix', 'because', 'time', 'risk']},{p:'Explain why a software update will take two weeks.',kw:['because', 'time', 'testing', 'risk', 'example', 'impact']},{p:'Explain to a customer why their app crashed, without jargon.',kw:['sorry', 'because', 'fix', 'customer', 'impact', 'time']}]}];
SK.find(s=>s.id=='c3').q.push(...[{"p": "You must tell a client their feature will miss Friday. Which sentence is best?", "o": [["We cannot deliver the report feature by Friday; the new date is next Wednesday, and I will send a progress update on Monday.", 100, "States the fact, a new date and a follow-up, with no excuses."], ["Unfortunately, the report feature may be slightly delayed, and we are working hard to complete it soon.", 60, "Polite, but \"may\", \"slightly\" and \"soon\" hide what the client needs to know."], ["Due to unforeseen complications, delivery has been rescheduled at our discretion.", 30, "Formal-sounding, yet passive and vague, with no date."], ["We regret to inform you that Friday is no longer feasible; kindly be patient.", 10, "No new date, and \"be patient\" sounds dismissive."]]}, {"p": "A colleague wants a document reviewed today, but you are busy. Best reply?", "o": [["I cannot review it today, but I can send feedback by noon tomorrow. Would that work?", 100, "Honest about today, offers a specific alternative and checks agreement."], ["I am quite busy today, will try to look at it when I get time.", 60, "Honest, but gives no time commitment."], ["Sure, I will review it today.", 30, "Overpromising; if you miss it you lose trust."], ["Please check with someone else, as my schedule is full.", 10, "Declines without any help or alternative."]]}, {"p": "You must correct your manager's figure of 40% to 14% by email. Best wording?", "o": [["The source data lists 14%, not 40%. Could you confirm which figure we should present?", 100, "Cites the source, states the difference neutrally and asks for confirmation."], ["I think the figure might be a typo — it is probably 14%.", 60, "Tentative wording weakens a verifiable fact."], ["The 40% figure is wrong; it should be 14%.", 30, "Accurate but blunt; \"wrong\" sounds like blame, with no source."], ["With respect, I believe you may have overlooked the data.", 10, "Indirect and accusatory."]]}, {"p": "You need a teammate's input by Thursday. Which request is strongest?", "o": [["Could you share your section by Thursday 5 p.m.? I need it to finish the merged report on Friday.", 100, "Gives a specific deadline and the reason for it."], ["Please send your section as soon as you can; it would be really helpful.", 60, "Polite, but \"as soon as you can\" sets no deadline."], ["Kindly revert with your inputs at the earliest.", 30, "Stiff and vague; \"revert\" and \"at the earliest\" blur the ask."], ["I am waiting on you for the report, so please prioritise it.", 10, "Pressures the person instead of stating the need."]]}, {"p": "A customer is angry about a billing error your team caused. Best opening?", "o": [["I am sorry for the billing error. I have checked your account and will correct it today; you will get a confirmation email by 5 p.m.", 100, "Apology, action and a time commitment."], ["We apologise for any inconvenience and are looking into it.", 60, "A standard apology, but \"any\" and \"looking into it\" commit to nothing."], ["The error happened because the billing system was updated last week.", 30, "Explains instead of helping; sounds like an excuse."], ["Please calm down; we will fix it as soon as possible.", 10, "Dismisses their feelings and gives no date."]]}, {"p": "You disagree with a proposal in a meeting. Which sentence is most professional?", "o": [["I see the benefit in speed, but I am concerned about testing time. Could we compare both options against our deadline?", 100, "Acknowledges the point, states a concern and proposes a comparison."], ["I am not fully convinced about this approach; maybe we should think again.", 60, "Respectful, but gives no reason or next step."], ["With due respect, that proposal does not seem practical.", 30, "\"With due respect\" often signals criticism, and no alternative is offered."], ["That will not work. We tried it before.", 10, "Dismissive, with no evidence."]]}]);// 4 original + 6 harder scenarios = 10
// ---- Extra practices: 8 new scenarios each for Phase 1 (comm), Phase 2 (int) and Phase 3 (work) ----

// PHASE 1 — Communication (8): c1 x3, c2 x3, c3 x2
c1:[{p:'You join a group call with a client for the first time. Introduce yourself in 30 seconds.',kw:['name','role','project','skills','looking','team']},{p:'At a networking event a stranger asks what you do. Give a short, confident introduction.',kw:['name','student','studying','interested','project','goal']},{p:'Write a two-line introduction for your first message in a new team chat.',kw:['name','joined','skills','project','looking','glad']}],
c2:[{p:'Explain to a junior how to prepare for an exam, in 4–5 clear steps.',kw:['first','then','next','finally','because','step']},{p:'Describe a problem you faced recently and how you solved it, in simple words.',kw:['problem','because','tried','solved','example','learned']},{p:'Give clear instructions to a new student on how to find the library from the main gate.',kw:['first','then','turn','next','finally','left','right']}],
c3:[{p:'A teacher sent you the wrong deadline by mistake and you noticed. Which message is best?',o:[['Thank you for the update. The portal shows the deadline as 20 October, but your message says 18 October. Could you please confirm the correct date?',100,'Names both dates neutrally and asks one clear question.'],['Hi, I think the date might be different. Can you check?',60,'Polite, but does not say which date or where the mismatch is.'],['Your date is wrong. Please correct it.',30,'Direct but blunt; it reads as blame rather than a request.'],['Okay noted.',10,'Ignores the mismatch, so the problem stays hidden.']]},{p:'You want to ask a senior for a short mentoring chat. Which message is best?',o:[['Could we have 15 minutes this week to discuss my project approach? I am free Wednesday or Thursday after 3 p.m.',100,'Clear purpose, small ask and specific time options.'],['Would you be able to guide me sometime if you have time?',60,'Polite, but no purpose or time makes it easy to postpone.'],['I need your help urgently, please call me.',30,'Urgency without a reason puts pressure on the senior.'],['Hey, free? Need help.',10,'Casual and gives no information.']]}],

i1:[{p:'HR: "Tell me about yourself in two minutes, starting with your education."',kw:['education','degree','skills','project','role','goal','looking']},{p:'HR: "Tell me about yourself and what you are looking for in your first job."',kw:['degree','skills','project','looking','learn','role','goal']}],
i2:[{p:'HR: "Why should we hire you for this role over an experienced candidate?"',kw:['learn','project','skills','team','contribute','role','because']},{p:'HR: "What do you know about our company, and why do you want to work here?"',kw:['company','products','learn','skills','contribute','role','because']}],
i3:[{p:'HR: "Tell me about a time you worked under a tight deadline."',kw:['deadline','plan','prioriti','team','result','example','learned']},{p:'HR: "Where do you see yourself in five years?"',kw:['learn','grow','role','skills','contribute','goal','team']}],
i4:[{p:'Interviewer: "Which technologies did you use in your project, and why did you choose them?"',kw:['using','because','tools','project','chose','result','learned']},{p:'Interviewer: "How did you test your project, and what bugs did you find?"',kw:['test','bug','fixed','tools','result','learned','because']}],
// PHASE 3 — Professional skills (8): w1 x2, w2 x2, w3 x2, w4 x2
w1:[{p:'Your team cannot agree on who presents to the client. They ask you. You say:',o:[['Could we pick the person who knows the client best and have the other prepare the questions? Does that work for both of you?',100,'Uses a shared criterion and gives both people a valuable role.'],['Maybe we can take turns, I do not mind either way.',60,'Fair, but avoids deciding anything for this client.'],['Let the manager choose, I do not want to get involved.',30,'Hands off a problem the team can solve itself.'],['Whoever is senior should present.',10,'Hierarchy alone ignores skills and discourages the others.']]},{p:'A teammate keeps interrupting you in meetings. You:',o:[['After the meeting: "I noticed I often get cut off. Could we let each person finish, so we hear all ideas?"',100,'Private, specific and focused on a team benefit.'],['Say "Please let me finish" sharply in the meeting.',60,'Stops the behaviour, but in public and with an irritated tone.'],['Stay quiet and stop sharing ideas.',30,'The team loses your input and the problem stays.'],['Complain about them to other teammates.',10,'Gossip damages trust and fixes nothing.']]}],
w2:[{p:'You realise on Monday that Friday\'s task needs help from another team. You:',o:[['Message that team today with what you need, the deadline and why, and tell your manager about the dependency.',100,'Early, specific and keeps your manager informed.'],['Wait until Wednesday to see if you can do it alone.',60,'Leaves very little time for the other team to respond.'],['Assume they will help when they can.',30,'Hope is not a plan and creates a hidden risk.'],['Skip that part and submit the rest.',10,'Delivers incomplete work without telling anyone.']]},{p:'You are asked to estimate how long a new task will take, and you are unsure. You:',o:[['Say: "My estimate is three days, but I would like a quick check after day one to confirm the scope."',100,'Gives a number, names the uncertainty and builds in a checkpoint.'],['Say: "It should take around three days, maybe four."',60,'Gives a range but no plan for the uncertainty.'],['Say: "One day, easily."',30,'Optimistic guess without thinking sets up a miss.'],['Say: "I cannot say."',10,'Refuses to give any estimate to plan with.']]}],
w3:[{p:'Your senior says, "This code is hard to read." You say:',o:[['Thanks. Could you point to one example so I can fix it and apply the same style across the file?',100,'Asks for a concrete example and promises a wider fix.'],['I will clean it up.',60,'Willing, but without an example you may fix the wrong thing.'],['It works fine, so the style does not matter.',30,'Dismisses the point instead of listening.'],['Why does everyone criticise my code?',10,'Defensive and turns feedback into a complaint.']]},{p:'After a presentation, your manager says you spoke too fast. You say:',o:[['Thanks for telling me. I will practise with a timer and pause after each slide; could I try again in the next meeting?',100,'Accepts, names an action and asks for another chance.'],['Okay, I will try to slow down.',60,'Accepts it, but gives no concrete plan.'],['I was nervous because there was too little time.',30,'Explains instead of taking the feedback.'],['Nobody told me about a speed limit.',10,'Sarcastic and defensive.']]}],

};

const XP2={
// PHASE 1 (10): c1 x3, c2 x3, c3 x4
c1:[{p:'You are asked to introduce yourself at a family friend\'s company get-together. Keep it friendly and professional.',kw:['name','student','studying','interested','project','goal','looking']},{p:'Introduce yourself in a college club meeting and say what you hope to contribute.',kw:['name','year','interested','skills','contribute','project','join']},{p:'You are at a career fair stall. The recruiter says, "Introduce yourself in 20 seconds."',kw:['name','degree','skills','project','looking','role','interested']}],
c2:[{p:'Explain what you did over your last holiday, with a clear beginning, middle and end.',kw:['first','then','next','finally','because','example','learned']},{p:'Explain to a friend how an ATM or UPI payment works, in simple words.',kw:['first','then','next','because','simple','example','means']},{p:'Describe a person you admire and why, in 4–5 clear sentences.',kw:['because','admire','example','learned','qualit','inspire','helped']}],
c3:[{p:'You must decline a meeting invite that clashes with your exam. Which reply is best?',o:[['Thank you for the invite. I have an exam at that time and cannot attend; could we meet on Thursday at 4 p.m. instead?',100,'Gives the reason, a clear no and a specific alternative.'],['Sorry, I am not free then. Maybe another time.',60,'Polite, but offers no alternative time.'],['I cannot come, I have exams.',30,'Accurate but abrupt and without an offer.'],['No.',10,'No reason, no courtesy.']]},{p:'You need to remind a teammate about a pending reply. Which message is best?',o:[['Hi Asha, a quick reminder about the venue list I asked for on Monday. Could you share it by 3 p.m. today?',100,'Friendly, specific and gives a deadline.'],['Just checking if you saw my earlier message.',60,'Polite, but no request or time.'],['Why have you not replied yet?',30,'Sounds like blame.'],['Reply fast!!!',10,'Demanding and unprofessional.']]},{p:'You want to thank a senior who stayed late to help you. Which message is best?',o:[['Thank you for staying late to help me fix the report. Your tips on formatting saved me a lot of time.',100,'Specific about the help and its impact.'],['Thanks a lot for your help.',60,'Polite but generic.'],['Thanks, you are the best!!!',30,'Warm but vague and over the top.'],['ok thx',10,'Too casual for a senior.']]},{p:'You made an error in a shared spreadsheet. Which message to the team is best?',o:[['I found an error in column D of the budget sheet. I have fixed it and added a note, so please use the updated version.',100,'Owns the error, says what changed and what to do.'],['There was a small issue in the sheet, but it is fine now.',60,'Vague about what and where.'],['Someone entered wrong numbers in the sheet.',30,'Avoids ownership.'],['Never mind, ignore the sheet.',10,'Confusing and gives no useful fix.']]}],

mk('g1','gd','Starting a GD','Open with a short definition or fact, state your stance in one sentence and invite the group. Do not rush with a long speech.',['topic','point','because','example','everyone'],[[`Topic: "Remote work is better than office work." You speak first. Open the GD.`,`remote office`],[`Topic: "Social media does more harm than good." Start by defining the topic.`,`social media`],[`Topic: "AI will replace jobs." Open in 30 seconds with one fact and your stance.`,`jobs stance`],[`Nobody speaks after the topic is given. How do you break the silence?`,`start begin`],[`Topic: "Should college attendance be compulsory?" Open with a clear framework.`,`attendance`],[`The moderator says "Begin" and three people talk together. What do you do?`,`wait moderator`],[`Topic: "Online vs offline exams." Give a two-line opening.`,`exams`],[`Topic: "Startups vs MNC jobs for freshers." Open and invite the group.`,`startup invite`],[`You are nervous before your first sentence in a GD. How do you start anyway?`,`prepare nervous`],[`Topic: "Electric vehicles are the future." Start with a definition and a fact.`,`vehicles fact`]]);
mk('g2','gd','Making points with facts','One point, one reason, one real example. Use facts you are sure of; never invent numbers.',['point','because','example','fact','data'],[[`Argue "Cashless payments should be encouraged" with one fact and one example.`,`cashless`],[`Someone says "Online learning does not work." Respond with an example.`,`online learning`],[`Support "Work-life balance matters" with a reason and a real-life example.`,`balance`],[`You are unsure about a statistic. How do you present your point safely?`,`approximately source`],[`Make a point on "Plastic should be banned" without exaggerating.`,`plastic`],[`Someone challenges your fact. How do you back it up?`,`source challenge`],[`Explain why "Internships are important for freshers" in three sentences.`,`internships`],[`Add a new point on "Smart cities" that nobody has made.`,`smart cities new`],[`Link your point on "Gig economy" to what the previous speaker said.`,`previous speaker`],[`Give a balanced point against "Homework should be abolished".`,`homework balanced`]]);
mk('g3','gd','Handling interruptions','Stay calm and polite, finish your key point, bring quiet members in and steer back to the topic.',['polite','finish','point','group','calm'],[[`A participant keeps interrupting you mid-sentence. How do you respond?`,`interrupt`],[`One person dominates and does not let others speak. What do you do?`,`dominate`],[`Someone speaks loudly and aggressively against your point. Respond.`,`aggressive loud`],[`You are interrupted just as you reach your key point. What do you say?`,`key point`],[`A quiet participant has not spoken at all. How can you bring them in?`,`quiet invite`],[`Two people start arguing personally. How do you steer the GD back?`,`argue topic`],[`Someone mocks your opinion. How do you reply and stay calm?`,`mock`],[`You interrupted someone by mistake. What do you do next?`,`sorry continue`],[`The group goes off-topic. How do you bring it back politely?`,`off-topic back`],[`A participant repeats your point as their own. How do you react?`,`repeat credit`]]);
mk('g4','gd','Agreeing & disagreeing politely','Acknowledge the other view, give your reason, add something new and keep respect.',['agree','because','point','view','respect'],[[`You partly agree with a speaker on "Work from home". Respond.`,`partly`],[`Disagree politely with "College degrees are useless."`,`degrees`],[`A participant states a wrong fact. Correct it respectfully.`,`fact correct`],[`Build on the previous speaker's point and add your own on "Digital India".`,`build add`],[`Everyone agrees and nothing new is left. How do you add value?`,`new value`],[`Disagree with the majority on "Four-day work week".`,`majority week`],[`Someone says "You are wrong!" to you. How do you respond?`,`wrong`],[`Support a quiet teammate's ignored idea on "Green energy".`,`support idea`],[`You changed your mind during the GD. How do you say it?`,`changed mind`],[`Disagree with a speaker who looks senior in the room. What do you say?`,`senior`]]);
mk('g5','gd','Summarising & concluding','Restate the main views fairly, name the common ground, add no new points and close in under 30 seconds.',['summar','overall','point','agree','conclu'],[[`The moderator asks for a closing summary on "Online education". Give it.`,`online education`],[`The GD ended in disagreement. How do you conclude fairly?`,`disagree fair`],[`You have 30 seconds to conclude on "Social media". What do you say?`,`social media seconds`],[`Summarise three different views on "Remote work" without new points.`,`views remote`],[`How do you end a GD so the group can reach a final stand?`,`final stand`],[`Conclude "Should freshers take startup jobs?" with a balanced recommendation.`,`startup recommendation`],[`You are asked to summarise but missed some points. What do you do?`,`missed`],[`Give a one-sentence conclusion for "AI in education".`,`AI education`],[`After a heated GD, close it positively and thank the group.`,`thank positive`],[`Explain what a good conclusion includes, with an example on "Smart cities".`,`smart example`]]);
mk('l1','ld','Taking initiative','Spot a problem, propose a fix, start small and keep people informed. Do not wait to be told.',['problem','plan','team','start','because'],[[`The team keeps missing small deadlines. What initiative do you take?`,`deadlines tracker`],[`Your club has no clear plan for an event in 3 weeks. What do you do?`,`event club`],[`You find a faster way to do a repetitive task. How do you share it?`,`faster share`],[`A new joiner is lost on day one and nobody is helping. What do you do?`,`new joiner`],[`You see a mistake in a process owned by someone else. What do you do?`,`process owner`],[`A college project group has no leader. How do you step up?`,`project group`],[`An idea needs extra work outside your role. How do you decide to take it?`,`extra role`],[`The team is stuck waiting for approval. How do you move things forward?`,`approval`],[`You volunteer to lead a task and are unsure how. What are your first steps?`,`volunteer steps`],[`An initiative you took failed. How do you handle it with the team?`,`failed learn`]]);

const RS=[['Career objective','The objective is the first thing a recruiter reads and the first block an ATS reads for your target role. Write 2–3 lines: the exact role you want, 2–3 skills you can really demonstrate, and one proof such as a project or internship. Rewrite the role title for every application.','Aspiring Web Developer with hands-on React and Node.js project experience, seeking an entry-level role to build user-focused products.',['Use the job title exactly as written in the job post.','Keep it to 25–60 words; longer objectives are skipped.','Mention only skills you can explain in an interview.','Avoid clichés like "hard working", "team player", "challenging position".','Do not use "I", "my" or "me".']],
['Education','Recruiters check this to confirm you meet the minimum qualification, and ATS filters often search for the degree name. List newest first: degree and branch, college or university, years, and CGPA or percentage.','B.Tech Computer Science, ABC Institute of Technology, 2022–2026, CGPA 8.1/10',['Write the full degree name once (B.Tech, B.Sc, BCA…).','Always include the graduation year, as a range or a single year.','Add CGPA or percentage only if you are comfortable discussing it.','Skip school marks unless the job post asks for them.','Do not add a photo, date of birth or ID numbers.']],
['Technical skills','This is the main keyword section for ATS. Group skills by type, use the same spelling as the job post, and list only tools you could use in a live task tomorrow. Honest and short beats long and exaggerated.','Languages: JavaScript, Python · Web: HTML, CSS, React · Database: MySQL · Tools: Git, GitHub',['Group with labels such as Languages, Web, Tools.','Use plain names (React, not "React expert level").','No rating bars, stars or percentages; ATS cannot read them and they look unproven.','Do not list a tool you only watched one video about.','Keep soft skills such as teamwork for your projects and interview.']],

function scoreText(t,kw){const w=t.toLowerCase().split(/\s+/).filter(Boolean),n=w.length,low=t.toLowerCase();
const sents=t.split(/[.!?]+/).filter(x=>x.trim()).length;
const hits=kw.filter(k=>low.includes(k)).length,c={};
c.Relevance=Math.min(100,hits/Math.max(2,kw.length*.5)*100);
const st=['first','then','also','finally','because','for example','currently','next','my '].filter(k=>low.includes(k)).length;
c.Structure=Math.min(100,st*22+(sents>=3?25:0));
c.Clarity=n<15?25:n>200?55:Math.max(30,100-Math.max(0,n/Math.max(sents,1)-22)*5)-(BAD.filter(b=>low.includes(b)).length*20);
c['Professional language']=Math.min(100,PRO.filter(k=>low.includes(k)).length*22)-BAD.filter(b=>low.includes(b)).length*25;
c.Completeness=Math.min(100,n/50*70+(/\d/.test(t)||/project/.test(low)?30:0));
c.Confidence=100-HEDGE.filter(h=>low.includes(h)).length*30;
let tot=0;for(const k in c){c[k]=Math.round(Math.max(0,Math.min(100,c[k])));tot+=c[k]*W[k]}
const miss=kw.filter(k=>!low.includes(k)).slice(0,3),bd=BAD.filter(b=>low.includes(b)),hg=HEDGE.filter(h=>low.includes(h));
const FB={Relevance:`You did not touch on: ${miss.join(', ')||'the key points'}. Re-read the question and answer it directly first.`,Structure:`Your answer has ${sents} sentence(s) with few ordering words. Use a clear order (First… Then… Finally…) so listeners can follow.`,Clarity:`Your answer is ${n} words${n<40?' — too short to be clear; aim for 50–120':', with long sentences; split them up'}${bd.length?'; also drop "'+bd[0]+'"':''}.`,'Professional language':`${bd.length?'You used casual wording ("'+bd[0]+'"). ':''}Use professional phrasing such as "I developed", "I learned", "I would".`,Completeness:'No concrete example, number or project is mentioned. Add one real example with its result.',Confidence:`${hg.length?'You used hedges ("'+hg.join('", "')+'") which sound unsure. ':''}State things directly.`};
const good=[],fix=[];for(const k in c)(c[k]>=65?good:fix).push(c[k]>=65?'✓ '+k+' ('+c[k]+'%)':'⚠ '+k+' ('+c[k]+'%): '+FB[k]);

return`<h1>Today's Real-World Missions</h1><p class="mu">Based on the skills you ${tp.length?'passed today':pr.length?'practised today':'have passed'}: ${ts.map(id=>SK.find(x=>x.id==id).t).join(', ')}. Practise again tomorrow to get 3 new missions.</p><div class="card"><b>${nd} / ${tot} completed today</b>${bar(Math.round(nd/tot*100))}</div>${nd==tot?`<h2>🧠 Your coaching report</h2>${coachHtml(D)}`:`<p class="mu">Finish all ${tot} missions to unlock your coaching report: honest suggestions based on what you write. Pass a new skill today and your open missions refresh.</p>`}
${D.ids.map((id,i)=>{const m=missOf(id),sk=SK.find(x=>x.id==id.split('.')[0]),d=D.done[id];return`<div class="card" style="border-left:6px solid ${d?'var(--acc)':'var(--pri)'}"><span class="mu">${sk.t} · Mission ${i+1} of ${tot}</span><h2>${d?'✅ ':''}${m[0]}</h2><p>${m[1]}</p>${d?`<p><b>Completed.</b> ${esc(d)}</p>`:`<label for="rn${i}">What did you do, and what was the hardest part?</label><textarea id="rn${i}" rows="2"></textarea><br><button class="btn g" onclick="doneM('${id}',${i})">I did it — mark complete</button>`}</div>`}).join('')}${missHist(k)}`}
function doneM(id,i){const t=$('#rn'+i).value.trim();if(t.length<10)return alert('Please write a little more (10+ characters): what you did and what was hardest.');S.mis[today()].done[id]=t;save();go('mis')}
function prog(){const s=scores();return`<h1>Progress</h1>${SK.map(k=>`<div class="card"><div class="row sp"><b>${k.t}</b><span>${(S.att[k.id]||[]).map(a=>a.s+'%').join(' → ')||'—'}</span></div>${bar(best(k.id))}</div>`).join('')}<div class="card"><b>Overall readiness ${s.ready}%</b>${bar(s.ready)}</div>`}
function final(){const s=scores(),ok=finalReady();const chk=[[nPass()==SK.length,'All '+SK.length+' skills passed ('+nPass()+')'],[resumeScore().total>=65,'Resume ≥ 65%'],[nMis()>=3,'3 real-world missions']];
const items=[['Interview ready',s.Interview],['Resume ready',s.Resume],['Workplace ready',s.Workplace],['Communication',s.Communication],['Real-world practice',Math.min(100,nMis()*25)]];
const rec=items.filter(x=>x[1]<65).map(x=>`<li>Focus next on <b>${x[0]}</b> (${x[1]}%).</li>`).join('')||'<li>All areas above 65% — try a real interview!</li>';
const badge=s.ready>=65&&items.every(x=>x[1]>=65);
return`<h1>Job Readiness</h1><div class="card"><h3>Unlock requirements</h3>${chk.map(c=>`<p>${c[0]?'✅':'⬜'} ${c[1]}</p>`).join('')}</div>
<div class="card"><h2>JOB READINESS ${s.ready}%${ok?'':' (preview)'}</h2>${items.map(x=>`<p>${x[1]>=65?'✓':'⚠'} ${x[0]} — ${x[1]}%${bar(x[1])}</p>`).join('')}<b>Personalized recommendations</b><ul>${rec}</ul></div>
${badge?`<div class="hero"><h2>🏅 JOB READY</h2><p><b>${esc(S.prof.name)}</b><br>Readiness ${s.ready}% · Communication ${s.Communication}% · Interview ${s.Interview}% · Resume ${s.Resume}% · Workplace ${s.Workplace}% · Missions ${nMis()}</p></div>`:'<div class="card mu">Reach 65%+ in every area to earn the Job-Ready badge.</div>'}`}
function prof(){const p=S.prof,s=scores(),L=LV(s.ready),st=SK.filter(k=>(S.att[k.id]||[]).length),att=SK.reduce((a,k)=>a+(S.att[k.id]||[]).length,0);
const bs=[...st].sort((a,b)=>best(b.id)-best(a.id))[0],wk=st.filter(k=>!passed(k.id)).sort((a,b)=>best(a.id)-best(b.id))[0],n=nextSk();
const rows=[['Education level',p.edu],['Degree / branch',p.deg],['Graduation year',p.gy],['Interview experience',p.exp],['Communication confidence',p.conf+' / 5'],['Resume status',p.resume]];
const rec=SK.flatMap(k=>(S.att[k.id]||[]).map((a,i)=>[k.t,i+1,a.s])).slice(-8).reverse();
return`<div class="pbanner"><div class="av">${esc(p.name.trim()[0].toUpperCase())}</div><div><h1 style="margin:0">${esc(p.name)}</h1><p style="margin:4px 0;opacity:.9">${esc(p.deg||'—')} · Class of ${esc(p.gy)}</p><span class="tag" style="background:${L[1]}">${s.ready}% · ${L[0]}</span></div></div>
<div class="card row sp"><div class="ring" style="background:conic-gradient(${L[1]} ${s.ready*3.6}deg,var(--bd) 0)"><div>${s.ready}%</div></div><div style="flex:1;min-width:200px"><h3>Job readiness</h3><p><span class="tag" style="background:${L[1]}">${L[0]}</span></p><p class="mu">Skills passed: ${nPass()} / ${SK.length}${n?' · Next: '+n.t:''}</p></div></div>
<div class="grid"><div class="card"><span class="mu">Skills passed</span><h2>${nPass()} / ${SK.length}</h2></div><div class="card"><span class="mu">Daily streak</span><h2>🔥 ${streak().cur} ${dayW(streak().cur)}</h2></div><div class="card"><span class="mu">Missions done</span><h2>${nMis()}</h2></div><div class="card"><span class="mu">Practice attempts</span><h2>${att}</h2></div></div>
<div class="pcols"><div class="card"><h3>Personal details</h3>${rows.map(r=>`<div class="kv"><span class="mu">${r[0]}</span><b>${esc(r[1]||'—')}</b></div>`).join('')}</div>
<div class="card"><h3>Skill mastery</h3>${SK.map(k=>`<div style="margin:7px 0"><div class="row sp"><span>${k.t}</span><b>${best(k.id)}%</b></div>${bar(best(k.id))}</div>`).join('')}</div>
<div class="card"><h3>Strengths &amp; focus</h3><div class="kv"><span class="mu">Strongest skill</span><b>${bs?bs.t+' ('+best(bs.id)+'%)':'—'}</b></div><div class="kv"><span class="mu">Needs most work</span><b>${wk?wk.t+' ('+best(wk.id)+'%)':'—'}</b></div><div class="kv"><span class="mu">Best streak</span><b>${streak().best} ${dayW(streak().best)}</b></div><div class="kv"><span class="mu">Next skill</span><b>${n?n.t:'All passed'}</b></div></div>
<div class="card"><h3>Recent attempts</h3>${rec.length?rec.map(r=>`<div class="kv"><span>${r[0]} · attempt ${r[1]}</span><b style="color:${LV(r[2])[1]}">${r[2]}%</b></div>`).join(''):'<p class="mu">No attempts yet.</p>'}</div></div>
<br><button class="btn o" onclick="if(confirm('Reset all progress?')){S={prof:null,att:{},mis:{},res:{},daily:[0,0,0],streak:1};save();start=false;go('home')}">Reset everything</button>`}
const V={home,dash,road,practice:()=>list('practice'),int:()=>list('int'),work:()=>list('work'),comm:()=>list('comm'),gd:()=>list('gd'),ld:()=>list('ld'),resume,mis,prog,final,prof,skill};
function topbar(){const has=!!S.prof,st=streak(),ini=has?esc((S.prof.name.trim()[0]||'?').toUpperCase()):'👤';
return`<header class="topbar"><button class="logo" aria-label="fresherMate home" onclick="${has?"go('home')":"start=false;render();scrollTo(0,0)"}"><i>f</i><span>fresherMate</span></button><div class="tb-r"><span class="streak ${st.today?'on':''}" title="Daily practice streak" aria-label="Streak: ${st.cur} ${dayW(st.cur)}">🔥 ${st.cur}</span><button class="pbtn ${view=='prof'&&has?'on':''}" aria-label="Profile" onclick="${has?"go('prof')":"start=true;render();scrollTo(0,0)"}">${ini}</button></div></header>`}
function render(){const a=$('#app');if(!S.prof){a.innerHTML=topbar()+(start?assess():landing());return}
a.innerHTML=topbar()+`<main>${view!='home'?'<button class="btn o" onclick="back()" style="margin-bottom:14px">← Back</button>':''}${V[view]()}</main>`}
render();
</script><script>
(function(){
var c=document.getElementById('sky');if(!c)return;var x=c.getContext('2d');
var W=0,H=0,D=1,stars=[],shoot=null,still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var TINT=['255,255,255','255,255,255','200,225,255','190,255,235','255,244,200'];
function make(){
  var n=Math.min(320,Math.round(W*H/5200));stars=[];
  for(var i=0;i<n;i++){var z=Math.random();
    stars.push({x:Math.random()*W,y:Math.random()*H,z:z,r:(.35+z*1.25),
      a:.35+Math.random()*.65,t:Math.random()*6.28,ts:.6+Math.random()*1.8,
      c:TINT[(Math.random()*TINT.length)|0]});}
}
function size(){D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);make();}
function spawn(){var a=Math.PI*(.18+Math.random()*.12);
  shoot={x:Math.random()*W*.8+W*.1,y:Math.random()*H*.35,vx:Math.cos(a)*9,vy:Math.sin(a)*9,l:0,max:55+Math.random()*25};}
var last=0;
function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
  x.clearRect(0,0,W,H);
  for(var i=0;i<stars.length;i++){var s=stars[i];
    if(!still){s.x-=(4+s.z*16)*dt;s.y+=(1+s.z*3)*dt;s.t+=s.ts*dt;
      if(s.x<-2){s.x=W+2;s.y=Math.random()*H}if(s.y>H+2){s.y=-2;s.x=Math.random()*W}}
    var tw=still?1:(.65+.35*Math.sin(s.t));
    x.fillStyle='rgba('+s.c+','+(s.a*tw).toFixed(3)+')';
    x.beginPath();x.arc(s.x,s.y,s.r,0,6.2832);x.fill();
    if(s.z>.85){x.fillStyle='rgba('+s.c+','+(s.a*tw*.18).toFixed(3)+')';x.beginPath();x.arc(s.x,s.y,s.r*3.2,0,6.2832);x.fill();}
  }
  if(!still){
    if(!shoot&&Math.random()<.004)spawn();
    if(shoot){shoot.x+=shoot.vx;shoot.y+=shoot.vy;shoot.l++;
      var f=1-shoot.l/shoot.max,g=x.createLinearGradient(shoot.x,shoot.y,shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);
      g.addColorStop(0,'rgba(255,255,255,'+(.9*f).toFixed(3)+')');g.addColorStop(1,'rgba(255,255,255,0)');
      x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x-shoot.vx*9,shoot.y-shoot.vy*9);x.stroke();
      if(shoot.l>shoot.max||shoot.x>W+60||shoot.y>H+60)shoot=null;}
    requestAnimationFrame(frame);
  }
}
size();addEventListener('resize',size);requestAnimationFrame(frame);
})();
</script></body></html>
